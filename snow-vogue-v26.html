function addUniqueItems(target, extras){for(const item of extras){if(!target.some(v=>v[0]===item[0]))target.push(item);}}
function ensureCount(target,pool,count=20){let k=1;while(target.length<count){let base=pool[(target.length+k)%pool.length];target.push([`${base[0]} ${k}`,base[1],base[2]]);k++;}}
function extendWardrobe(theme, extraSets){for(let i=0;i<5;i++){addUniqueItems(theme.items[i], extraSets[i]);ensureCount(theme.items[i], extraSets[i].length?extraSets[i]:theme.items[i], 20);}}

function tailored(g,type,c,k){const ivory='#fff1e3';function shell(profile,depth=.75,pattern=''){let m=mesh(g,new T.LatheGeometry(profile.slice().sort((a,b)=>a[1]-b[1]).map(p=>new T.Vector2(...p)),64),c);m.scale.z=depth;m.material.side=T.DoubleSide;if(pattern){let cv=document.createElement('canvas');cv.width=cv.height=128;let ctx=cv.getContext('2d');ctx.fillStyle=c;ctx.fillRect(0,0,128,128);if(pattern==='check'){for(let x of [0,64]){ctx.fillStyle='#fff1d655';ctx.fillRect(x,0,19,128);ctx.fillRect(0,x,128,19);ctx.fillStyle='#342b4655';ctx.fillRect(x+23,0,7,128);ctx.fillRect(0,x+23,128,7);}}else{ctx.strokeStyle='#fff8e9aa';ctx.lineWidth=2;for(let x of [24,88])for(let y of [24,88])for(let a=0;a<3;a++){let t=a*Math.PI/3;ctx.beginPath();ctx.moveTo(x-13*Math.cos(t),y-13*Math.sin(t));ctx.lineTo(x+13*Math.cos(t),y+13*Math.sin(t));ctx.stroke();}}let tex=new T.CanvasTexture(cv);tex.colorSpace=T.SRGBColorSpace;tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(4,2);m.material.color.set('#ffffff');m.material.map=tex;}return m;}
